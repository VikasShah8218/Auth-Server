[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-sdk"
version = "0.2.0"
description = "Everything a downstream server needs to trust the central Auth Server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "joserfc>=1.7",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[tool.setuptools.packages.find]
include = ["auth_sdk*"]
