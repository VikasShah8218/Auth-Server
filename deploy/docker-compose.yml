# Production stack: Caddy (TLS + console) -> API -> PostgreSQL + Redis.
#   cp .env.example .env   # then set DOMAIN, ISSUER, MASTER_KEY, DB_PASSWORD
#   docker compose up -d --build
# Only Caddy publishes ports. Everything else stays on the private network.

name: auth-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  ENVIRONMENT: production
  ISSUER: ${ISSUER:?Set ISSUER in .env}
  MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY in .env}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: auth
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: auth
  REDIS_URL: redis://redis:6379/0
  # Only Caddy can reach the api container, so its X-Forwarded-For is trusted.
  FORWARDED_ALLOW_IPS: "*"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}

x-api-build: &api-build
  context: ../auth-server

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: auth
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Holds only rate-limit counters and login challenges, which are fine to lose: no persistence.
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    logging: *logging

  # Runs once per `up`, before the API starts, so the schema is always current and never migrated twice at once.
  migrate:
    build: *api-build
    image: auth-server-api:latest
    command: ["aerich", "upgrade"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build: *api-build
    image: auth-server-api:latest
    restart: unless-stopped
    environment:
      <<: *api-env
      WORKERS: ${WORKERS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  caddy:
    build:
      context: ../auth-client
    image: auth-server-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
