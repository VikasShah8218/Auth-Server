# Development helper: only PostgreSQL and Redis, published on localhost. Run the API and Vite natively.
#   docker compose -f docker-compose.dev.yml up -d
# Then in auth-server/.env:
#   DB_HOST=127.0.0.1  DB_PORT=5433  DB_USER=postgres  DB_PASSWORD=devpassword  DB_NAME=auth
#   REDIS_URL=redis://127.0.0.1:6380/2
# Ports 5433/6380 avoid clashing with a native PostgreSQL/Redis; override with DEV_PG_PORT / DEV_REDIS_PORT.

name: auth-server-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: auth
    ports:
      - "127.0.0.1:${DEV_PG_PORT:-5433}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"

volumes:
  pgdata_dev:
